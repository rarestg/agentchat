[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentchat"
version = "0.1.0"
description = "Minimal local MCP-only agent messaging for Codex CLI sessions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "rarestg" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = [
  "fastmcp>=2.10.5,<3",
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.32.0,<1",
  "typer>=0.15.0,<1",
  "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
agentchat = "agentchat.cli:app"

[project.urls]
Homepage = "https://github.com/rarestg/agentchat"
Repository = "https://github.com/rarestg/agentchat"
Issues = "https://github.com/rarestg/agentchat/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentchat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
